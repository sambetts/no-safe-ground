    <style>
      body { margin: 0; background: #070910; color: #d6f7ff; font: 14px system-ui, sans-serif; }
      main { max-width: 1200px; margin: 0 auto; padding: 24px; }

      section { background: #101522; border: 1px solid #263247; border-radius: 12px; padding: 16px; margin: 16px 0; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
      button { background: #1b2940; color: #e7fbff; border: 1px solid #37516f; border-radius: 8px; padding: 9px 10px; cursor: pointer; }
      button:hover { background: #263a59; }
      label { display: inline-flex; gap: 8px; align-items: center; margin: 6px 14px 6px 0; }
      input[type="range"] { width: 220px; }
    </style>
